{{ define "content" }}
<article>
    <header>
        <hgroup>
            <h1>Symptom History</h1>
            <p>View all logged symptoms</p>
        </hgroup>
        <button data-action="back-to-symptoms">
            ← Back to Symptoms
        </button>
    </header>

    <!-- Filter Controls -->
    <article x-data="{
        startDate: '',
        endDate: '',
        courseId: ''
    }">
        <header>
            <h3>Filters</h3>
        </header>

        <div class="grid">
            <label>
                Start Date
                <input type="date" x-model="startDate">
            </label>
            <label>
                End Date
                <input type="date" x-model="endDate">
            </label>
        </div>

        <button data-action="apply-filters">
            Apply Filters
        </button>
    </article>

    <!-- Symptoms List -->
    <div id="symptoms-list">
        <p aria-busy="true">Loading symptoms...</p>
    </div>

    <!-- Delete Confirmation Modal (hidden by default) -->
    <div id="delete-modal"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; padding: 1rem;">
        <div
            style="max-width: 400px; width: 100%; margin: 0; background: var(--color-surface); border-radius: 8px; padding: 2rem;">
            <header style="margin-bottom: 1.5rem;">
                <h3 style="margin: 0; color: var(--color-text-primary);">Confirm Delete</h3>
            </header>

            <p style="margin-bottom: 1.5rem;">Are you sure you want to delete this <strong
                    id="delete-symptom-type">symptom log</strong>? This action cannot be undone.</p>

            <div class="grid">
                <button type="button" data-action="close-delete-modal" class="secondary">
                    Cancel
                </button>
                <button type="button" data-action="confirm-delete-symptom" class="contrast">
                    Delete
                </button>
            </div>
        </div>
    </div>

    <style>
        .modal-overlay {
            animation: fadeIn 0.2s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        [x-cloak] {
            display: none !important;
        }

        /* Mobile responsiveness */
        @media (max-width: 768px) {
            .modal-overlay {
                align-items: flex-start;
                padding: 0.5rem;
            }
        }
    </style>

    <!-- Symptom Edit Modal (hidden by default) -->
    <div id="symptom-edit-modal"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; padding: 1rem;">
        <div
            style="max-width: 600px; width: 100%; margin: 0; background: var(--color-surface); border-radius: 8px; padding: 2rem; position: relative;">
            <header style="margin-bottom: 1.5rem;">
                <button type="button" data-action="close-edit-modal" aria-label="Close"
                    style="position: absolute; top: 1rem; right: 1rem; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--color-text-secondary);">
                    ✕
                </button>
                <h2 style="margin: 0; color: var(--color-text-primary);">Edit Symptom Log</h2>
            </header>

            <form id="symptom-edit-form">
                <label>
                    <strong>Pain Level:</strong> <span id="pain-level-display">5</span>/10
                    <input type="range" id="edit-pain-level" min="1" max="10" value="5" style="margin-top: 0.5rem;">
                </label>

                <div class="grid">
                    <label for="edit_pain_location">
                        Location
                        <select id="edit_pain_location" required>
                            <option value="">Select location...</option>
                            <option value="injection_site">Injection Site</option>
                            <option value="abdomen">Abdomen</option>
                            <option value="back">Back</option>
                            <option value="head">Head</option>
                            <option value="other">Other</option>
                        </select>
                    </label>

                    <label for="edit_pain_type">
                        Type
                        <select id="edit_pain_type" required>
                            <option value="">Select type...</option>
                            <option value="sharp">Sharp</option>
                            <option value="dull">Dull</option>
                            <option value="aching">Aching</option>
                            <option value="cramping">Cramping</option>
                            <option value="throbbing">Throbbing</option>
                        </select>
                    </label>
                </div>

                <fieldset>
                    <legend>Other Symptoms</legend>
                    <label>
                        <input type="checkbox" value="nausea" name="symptoms">
                        Nausea
                    </label>
                    <label>
                        <input type="checkbox" value="fatigue" name="symptoms">
                        Fatigue
                    </label>
                    <label>
                        <input type="checkbox" value="headache" name="symptoms">
                        Headache
                    </label>
                    <label>
                        <input type="checkbox" value="mood_changes" name="symptoms">
                        Mood Changes
                    </label>
                    <label>
                        <input type="checkbox" value="dizziness" name="symptoms">
                        Dizziness
                    </label>
                    <label>
                        <input type="checkbox" value="other" name="symptoms">
                        Other
                    </label>
                </fieldset>

                <label for="edit_notes">
                    Notes (optional)
                    <textarea id="edit_notes" rows="3" placeholder="Describe your symptoms in detail..."></textarea>
                </label>

                <div class="grid">
                    <button type="button" data-action="close-edit-modal" class="secondary">
                        Cancel
                    </button>
                    <button type="submit">
                        Update Symptom Log
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- External JavaScript for CSP compliance -->
    <script src="/static/js/symptoms-history.js"></script>
</article>
{{ end }}
